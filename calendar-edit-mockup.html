<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar Edit — Mockup</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#f8f9fb; --surface:#fff; --border:#e2e6ea; --text:#1a1d23; --muted:#6b7280;
      --primary:#4f46e5; --primary-light:#eef2ff; --danger:#ef4444;
      --service:#4f46e5; --event:#0ea5e9; --leader:#f59e0b; --venture:#10b981;
      --shadow:0 1px 4px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.05);
      --shadow-lg:0 8px 32px rgba(0,0,0,.12);
    }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }

    .topbar { background:var(--surface); border-bottom:1px solid var(--border); padding:0 18px; height:58px; display:flex; align-items:center; justify-content:space-between; }
    .topbar-title { font-size:16px; font-weight:800; letter-spacing:-.3px; }
    .add-btn { display:inline-flex; align-items:center; gap:6px; background:var(--primary); color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }
    .add-btn:hover { background:#4338ca; }
    .add-btn svg { width:15px; height:15px; }

    .wrap { max-width:560px; margin:0 auto; padding:24px 18px 64px; }
    .hint { font-size:12px; color:var(--muted); margin-bottom:16px; line-height:1.5; }

    /* Event rows */
    .ev { display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px; box-shadow:var(--shadow); margin-bottom:10px; }
    .ev-bar { width:4px; align-self:stretch; border-radius:3px; flex-shrink:0; }
    .ev-bar.Service{background:var(--service);} .ev-bar.Event{background:var(--event);} .ev-bar.Leader{background:var(--leader);} .ev-bar.Venture{background:var(--venture);}
    .ev-main { flex:1; min-width:0; }
    .ev-name { font-size:14px; font-weight:700; }
    .ev-meta { font-size:12px; color:var(--muted); margin-top:2px; }
    .ev-type { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:2px 7px; border-radius:20px; }
    .ev-type.Service{background:#eef2ff;color:var(--service);} .ev-type.Event{background:#e0f2fe;color:var(--event);} .ev-type.Leader{background:#fef3c7;color:#b45309;} .ev-type.Venture{background:#d1fae5;color:#059669;}
    .ev-edit { width:30px; height:30px; border:none; background:none; color:var(--muted); cursor:pointer; border-radius:7px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .ev-edit:hover { background:var(--bg); color:var(--primary); }
    .ev-edit svg { width:15px; height:15px; }

    /* Modal */
    .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); align-items:center; justify-content:center; padding:16px; z-index:50; }
    .overlay.show { display:flex; }
    .modal { background:var(--surface); border-radius:16px; box-shadow:var(--shadow-lg); width:100%; max-width:420px; overflow:hidden; }
    .modal-head { padding:18px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .modal-title { font-size:16px; font-weight:800; }
    .modal-x { width:28px; height:28px; border:none; background:var(--bg); border-radius:50%; cursor:pointer; color:var(--muted); font-size:15px; }
    .modal-body { padding:18px 20px; display:flex; flex-direction:column; gap:14px; }
    .field { display:flex; flex-direction:column; gap:5px; }
    .field label { font-size:12px; font-weight:600; color:var(--muted); }
    .field input, .field select, .field textarea {
      border:1.5px solid var(--border); border-radius:8px; padding:9px 12px; font-size:14px; font-family:inherit;
      background:var(--bg); color:var(--text); outline:none; width:100%; -webkit-appearance:none;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color:var(--primary); background:var(--surface); }
    .field textarea { resize:vertical; min-height:70px; line-height:1.5; }
    .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .modal-foot { padding:14px 20px; border-top:1px solid var(--border); display:flex; align-items:center; gap:8px; }
    .btn-save { flex:1; background:var(--primary); color:#fff; border:none; border-radius:8px; padding:10px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
    .btn-save:hover { background:#4338ca; }
    .btn-cancel { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px 16px; font-size:14px; font-weight:600; color:var(--muted); cursor:pointer; font-family:inherit; }
    .btn-del { background:none; border:none; color:var(--danger); font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; margin-right:auto; display:none; }
    .btn-del.show { display:inline; }

    .mockup-badge { position:fixed; bottom:20px; right:20px; background:#f59e0b; color:#fff; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; border-radius:20px; padding:5px 14px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-title">📅 YA Calendar</div>
    <button class="add-btn" onclick="openAdd()">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Event
    </button>
  </div>

  <div class="wrap">
    <div class="hint">Tap <b>Add Event</b> to create one, or the ✏️ on any event to edit/delete it. (Leaders only — writes save back to the calendar sheet.)</div>
    <div id="list"></div>
  </div>

  <!-- Editor modal -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title" id="modalTitle">Add event</div>
        <button class="modal-x" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="field"><label>Name</label><input type="text" id="f-name" placeholder="e.g. Friday Hangout" /></div>
        <div class="field">
          <label>Type</label>
          <select id="f-type">
            <option>Service</option><option>Event</option><option>Leader</option><option>Venture</option>
          </select>
        </div>
        <div class="field"><label>Date</label><input type="date" id="f-date" /></div>
        <div class="row2">
          <div class="field"><label>Start time</label><input type="time" id="f-start" /></div>
          <div class="field"><label>End time</label><input type="time" id="f-end" /></div>
        </div>
        <div class="field"><label>Detail</label><textarea id="f-detail" placeholder="Location, what to bring, notes…"></textarea></div>
      </div>
      <div class="modal-foot">
        <button class="btn-del" id="btnDel" onclick="del()">Delete</button>
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-save" onclick="save()" id="btnSave">Add event</button>
      </div>
    </div>
  </div>

  <div class="mockup-badge">⚠ Mockup</div>

  <script>
    let EVENTS = [
      { id:1, name:'Sunday Service', type:'Service', date:'2026-06-14', start:'10:00', end:'11:30', detail:'Main auditorium' },
      { id:2, name:'YA Friday Hangout', type:'Event', date:'2026-06-19', start:'19:00', end:'', detail:'Connor & Sarah\'s place — bring a snack' },
      { id:3, name:'Leaders Huddle', type:'Leader', date:'2026-06-22', start:'18:30', end:'19:30', detail:'Planning for July' },
    ]
    let editingId = null
    const $ = id => document.getElementById(id)

    function fmt(ev){
      const d = new Date(ev.date+'T00:00:00')
      const ds = d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})
      const t = ev.start ? ' · ' + to12(ev.start) + (ev.end? '–'+to12(ev.end):'') : ''
      return ds + t + (ev.detail? ' · '+ev.detail : '')
    }
    function to12(t){ const [h,m]=t.split(':'); const hh=+h%12||12; return `${hh}:${m}${+h<12?'am':'pm'}` }

    function render(){
      $('list').innerHTML = EVENTS.map(ev => `
        <div class="ev">
          <div class="ev-bar ${ev.type}"></div>
          <div class="ev-main">
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="ev-name">${ev.name}</span>
              <span class="ev-type ${ev.type}">${ev.type}</span>
            </div>
            <div class="ev-meta">${fmt(ev)}</div>
          </div>
          <button class="ev-edit" onclick="openEdit(${ev.id})" title="Edit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          </button>
        </div>`).join('')
    }

    function openAdd(){
      editingId = null
      $('modalTitle').textContent = 'Add event'; $('btnSave').textContent = 'Add event'
      $('btnDel').classList.remove('show')
      $('f-name').value=''; $('f-type').value='Event'; $('f-date').value=''; $('f-start').value=''; $('f-end').value=''; $('f-detail').value=''
      $('overlay').classList.add('show'); $('f-name').focus()
    }
    function openEdit(id){
      const ev = EVENTS.find(e=>e.id===id); if(!ev) return
      editingId = id
      $('modalTitle').textContent = 'Edit event'; $('btnSave').textContent = 'Save'
      $('btnDel').classList.add('show')
      $('f-name').value=ev.name; $('f-type').value=ev.type; $('f-date').value=ev.date; $('f-start').value=ev.start; $('f-end').value=ev.end; $('f-detail').value=ev.detail
      $('overlay').classList.add('show')
    }
    function closeModal(){ $('overlay').classList.remove('show') }
    function save(){
      const ev = { name:$('f-name').value.trim(), type:$('f-type').value, date:$('f-date').value, start:$('f-start').value, end:$('f-end').value, detail:$('f-detail').value.trim() }
      if(!ev.name || !ev.date){ alert('Name and date are required.'); return }
      if(editingId){ Object.assign(EVENTS.find(e=>e.id===editingId), ev) }
      else { ev.id = Date.now(); EVENTS.push(ev); EVENTS.sort((a,b)=>a.date.localeCompare(b.date)) }
      closeModal(); render()
    }
    function del(){
      if(!confirm('Delete this event?')) return
      EVENTS = EVENTS.filter(e=>e.id!==editingId)
      closeModal(); render()
    }
    render()
  </script>
</body>
</html>
