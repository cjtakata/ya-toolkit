<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Follow-Up Dashboard — Mockup</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#f8f9fb; --surface:#fff; --border:#e2e6ea; --text:#1a1d23; --muted:#6b7280;
      --primary:#4f46e5; --primary-light:#eef2ff; --success:#10b981; --warning:#f59e0b;
      --college:#0ea5e9; --earlycareer:#8b5cf6; --youngpro:#f59e0b;
      --shadow:0 1px 4px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.05);
    }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }

    .page-head { background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%); padding:32px 28px 28px; }
    .ph-eyebrow { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:rgba(255,255,255,.6); margin-bottom:6px; }
    .ph-title { font-size:26px; font-weight:800; color:#fff; letter-spacing:-.4px; }
    .ph-sub { font-size:13px; color:rgba(255,255,255,.7); margin-top:4px; }

    .wrap { max-width:880px; margin:0 auto; padding:24px 20px 64px; }

    .range-row { display:flex; gap:8px; margin-bottom:20px; }
    .range-btn { border:1.5px solid var(--border); background:var(--surface); border-radius:8px; padding:7px 14px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; font-family:inherit; }
    .range-btn.active { border-color:var(--primary); background:var(--primary-light); color:var(--primary); }

    /* Stat cards */
    .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
    .stat { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; box-shadow:var(--shadow); }
    .stat-num { font-size:30px; font-weight:800; letter-spacing:-.5px; line-height:1; }
    .stat-label { font-size:12px; color:var(--muted); margin-top:6px; line-height:1.3; }
    .stat-accent-followups .stat-num { color:var(--primary); }
    .stat-accent-ftg .stat-num { color:#e11d48; }
    .stat-accent-leaders .stat-num { color:var(--success); }
    .stat-accent-awaiting .stat-num { color:var(--warning); }

    /* Leaderboard */
    .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); overflow:hidden; }
    .card-head { padding:16px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .card-title { font-size:14px; font-weight:700; }
    .card-hint { font-size:11px; color:var(--muted); }

    .lb-row { display:flex; align-items:center; gap:14px; padding:12px 18px; border-bottom:1px solid var(--border); }
    .lb-row:last-child { border-bottom:none; }
    .lb-rank { width:20px; font-size:13px; font-weight:700; color:var(--muted); text-align:center; flex-shrink:0; }
    .lb-avatar { width:34px; height:34px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#fff; }
    .lb-name { font-size:14px; font-weight:600; flex-shrink:0; width:130px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .lb-bar-wrap { flex:1; display:flex; align-items:center; gap:10px; min-width:0; }
    .lb-bar-track { flex:1; height:8px; background:var(--bg); border-radius:4px; overflow:hidden; }
    .lb-bar-fill { height:100%; background:var(--primary); border-radius:4px; }
    .lb-count { font-size:14px; font-weight:700; width:26px; text-align:right; flex-shrink:0; }
    .lb-ftg { font-size:11px; font-weight:600; color:#e11d48; background:#ffe4e6; border-radius:20px; padding:2px 9px; flex-shrink:0; width:74px; text-align:center; }

    .lb-head { display:flex; align-items:center; gap:14px; padding:8px 18px; background:var(--bg); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
    .lb-head .h-name { width:164px; flex-shrink:0; }
    .lb-head .h-bar { flex:1; }
    .lb-head .h-ftg { width:74px; text-align:center; flex-shrink:0; }

    .mockup-badge { position:fixed; bottom:20px; right:20px; background:var(--warning); color:#fff; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; border-radius:20px; padding:5px 14px; }

    @media (max-width:640px) { .stats { grid-template-columns:1fr 1fr; } .lb-name{width:90px;} .lb-head .h-name{width:124px;} }
  </style>
</head>
<body>
  <div class="page-head">
    <div class="ph-eyebrow">Young Adults Ministry</div>
    <div class="ph-title">Follow-Up Dashboard</div>
    <div class="ph-sub">Who's following up — and how many first-time guests are getting reached.</div>
  </div>

  <div class="wrap">
    <div class="range-row">
      <button class="range-btn active" data-range="all" onclick="setRange('all')">All time</button>
      <button class="range-btn" data-range="30" onclick="setRange('30')">Last 30 days</button>
    </div>

    <div class="stats">
      <div class="stat stat-accent-followups"><div class="stat-num" id="s-followups">38</div><div class="stat-label">Follow-ups logged</div></div>
      <div class="stat stat-accent-ftg"><div class="stat-num" id="s-ftg">16</div><div class="stat-label">First-time guests followed up</div></div>
      <div class="stat stat-accent-leaders"><div class="stat-num" id="s-leaders">6</div><div class="stat-label">Leaders active</div></div>
      <div class="stat stat-accent-awaiting"><div class="stat-num" id="s-awaiting">10</div><div class="stat-label">Still awaiting follow-up</div></div>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="card-title">Leaders</div>
        <div class="card-hint">ranked by follow-ups</div>
      </div>
      <div class="lb-head">
        <span style="width:20px;flex-shrink:0;"></span>
        <span class="h-name">Leader</span>
        <span class="h-bar">Follow-ups</span>
        <span class="h-ftg">FTG</span>
      </div>
      <div id="leaderboard"></div>
    </div>
  </div>

  <div class="mockup-badge">⚠ Mockup — sample data</div>

  <script>
    const PALETTE = ['#6366f1','#0ea5e9','#ec4899','#f59e0b','#10b981','#8b5cf6'];
    function color(name){let h=0;for(const c of name)h=(h<<5)-h+c.charCodeAt(0);return PALETTE[Math.abs(h)%PALETTE.length];}
    function initials(name){return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();}

    const DATA = {
      all: {
        followups:38, ftg:16, leaders:6, awaiting:10,
        rows:[
          {name:'Connor Takata', count:12, ftg:5},
          {name:'Sarah Chen',    count:9,  ftg:4},
          {name:'Mike Rivera',   count:7,  ftg:3},
          {name:'Jess Lee',      count:5,  ftg:2},
          {name:'Tyler Morgan',  count:3,  ftg:1},
          {name:'Mariah Davis',  count:2,  ftg:1},
        ],
      },
      '30': {
        followups:14, ftg:7, leaders:4, awaiting:10,
        rows:[
          {name:'Sarah Chen',    count:6, ftg:3},
          {name:'Connor Takata', count:4, ftg:2},
          {name:'Mike Rivera',   count:3, ftg:2},
          {name:'Jess Lee',      count:1, ftg:0},
        ],
      },
    };

    function render(range){
      const d = DATA[range];
      document.getElementById('s-followups').textContent = d.followups;
      document.getElementById('s-ftg').textContent = d.ftg;
      document.getElementById('s-leaders').textContent = d.leaders;
      document.getElementById('s-awaiting').textContent = d.awaiting;
      const max = Math.max(...d.rows.map(r=>r.count), 1);
      document.getElementById('leaderboard').innerHTML = d.rows.map((r,i)=>`
        <div class="lb-row">
          <div class="lb-rank">${i+1}</div>
          <div class="lb-avatar" style="background:${color(r.name)}">${initials(r.name)}</div>
          <div class="lb-name">${r.name}</div>
          <div class="lb-bar-wrap">
            <div class="lb-bar-track"><div class="lb-bar-fill" style="width:${Math.round(r.count/max*100)}%"></div></div>
            <div class="lb-count">${r.count}</div>
          </div>
          <div class="lb-ftg">${r.ftg} FTG</div>
        </div>`).join('');
    }
    function setRange(range){
      document.querySelectorAll('.range-btn').forEach(b=>b.classList.toggle('active', b.dataset.range===range));
      render(range);
    }
    render('all');
  </script>
</body>
</html>
