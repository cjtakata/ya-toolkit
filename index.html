<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>YA Toolkit</title>

    <!-- PWA / home screen icon -->
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f8f9fb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- No apple-mobile-web-app-status-bar-style: iOS 26 blurs anything drawn
         under a translucent status bar. Without it iOS gives the home-screen app
         an opaque status bar tinted from theme-color, and the page starts below it. -->
    <meta name="apple-mobile-web-app-title" content="YA Toolkit" />

    <!-- Link previews (Messages, Slack…). build.cjs makes copies of this page
         with their own previews for /install and guest links (/p/<id>).
         Previews are fetched without signing in: never put names here. -->
    <!-- og:start -->
    <meta name="description" content="For Venture Young Adults leaders: follow up with new guests, together." />
    <meta property="og:site_name" content="YA Toolkit" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="YA Toolkit" />
    <meta property="og:description" content="For Venture Young Adults leaders: follow up with new guests, together." />
    <meta property="og:image" content="https://ya-toolkit.vercel.app/og/app.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- og:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
